name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Unit + architecture + API integration tests (embedded PostgreSQL, OpenDB fixture; no network data).
      - run: ./mvnw -B -ntp verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      BACKEND_URL: http://localhost:8080
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Route types (PageProps/LayoutProps) are generated, not committed.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build

  models-3d:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3d
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: 3d/package-lock.json
      - run: npm ci
      - run: npm run validate
      # The generator is deterministic: rebuilding must reproduce the committed GLBs and catalog byte for byte.
      - run: npm run build
      - run: git diff --exit-code -- ../frontend/public/3d-models ../docs/3d

  e2e:
    # Whole stack as deployed: PostgreSQL, the API jar and a production build of the site, driven by a real browser.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FRONTEND_SHARED_SECRET: ci-e2e-secret
      BACKEND_URL: http://localhost:8080
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build API
        working-directory: backend
        run: ./mvnw -B -ntp -q package -DskipTests
      - name: Start API (OpenDB test fixture catalog)
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/app
          DATABASE_USERNAME: app
          DATABASE_PASSWORD: app
          OPENDB_SNAPSHOT_DIR: src/test/resources/opendb-fixture
          OPENDB_INGEST_ON_STARTUP: "true"
          EXAMPLE_PRICES: "true"
        run: |
          nohup java -jar target/platform-api-*.jar > ../api.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/actuator/health/readiness | grep -q UP && exit 0
            sleep 2
          done
          cat ../api.log; exit 1

      - name: Build and start site
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3000 > ../web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000 > /dev/null && exit 0; sleep 2; done
          cat ../web.log; exit 1

      - name: Run browser tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Keep traces and logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            frontend/test-results
            api.log
            web.log
          retention-days: 7

  docker-image:
    # The same image Railway builds (backend/Dockerfile from the repository root): catches build-time failures,
    # such as the snapshot download, before a deploy does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -f backend/Dockerfile -t platform-api:ci .
      - name: Image contains the pinned OpenDB snapshot
        run: |
          docker run --rm --entrypoint sh platform-api:ci -c \
            'cat /opt/opendb/CURRENT && ls /opt/opendb/$(cat /opt/opendb/CURRENT) && cat /opt/opendb/$(cat /opt/opendb/CURRENT)/SNAPSHOT.json'
