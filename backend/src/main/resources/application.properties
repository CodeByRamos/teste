spring.application.name=platform-api
server.port=${PORT:8080}

# Database: provided per environment (AWS RDS in production). Never commit credentials.
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.flyway.enabled=true

# Hardware data: pinned BuildCores OpenDB snapshot (see scripts/fetch-opendb.sh).
# In production run ingestion as a one-off job with PLATFORM_OPENDB_INGEST_ON_STARTUP=true.
platform.opendb.snapshot-dir=${OPENDB_SNAPSHOT_DIR:}
platform.opendb.ingest-on-startup=${OPENDB_INGEST_ON_STARTUP:false}

# Fictitious prices for development. Must be false once real price providers exist.
platform.pricing.example-prices=${EXAMPLE_PRICES:true}

platform.rate-limit.requests-per-minute=60
platform.rate-limit.trusted-proxies=${TRUSTED_PROXIES:}

server.error.include-message=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health

# Shared secret between the web frontend's server and this API (FRONTEND_SHARED_SECRET on both).
# When set, /api/** only answers the frontend. Leave unset in local development.
platform.frontend.shared-secret=${FRONTEND_SHARED_SECRET:}

# Readiness (/actuator/health/readiness) turns UP only after the catalog is loaded; hosts use it as health check.
management.endpoint.health.probes.enabled=true
